version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: csskinuz_backend
    restart: always
    env_file:
      - .env
    ports:
      - "4000:4000"
    networks:
      - csskinuz_net

  web:
    image: nginx:alpine
    container_name: csskinuz_web
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./apps/web/dist:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - csskinuz_net

networks:
  csskinuz_net:
    driver: bridge
